name: saldo_claro
description: "SaldoClaro: finanzas personales local-first para ingresos fijos, variables o inexistentes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Persistencia local (Fase 1: cero red)
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # UI

  # Utilidades
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.1
  build_runner: ^2.15.1

# Genera el icono del launcher (Android legacy + adaptive) desde el logo.
# Ejecutar tras modificar las imágenes: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo-app-1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo-app-adaptive.png"

flutter:
  uses-material-design: true

  # Licencias OFL de las fuentes (se muestran en la pantalla de licencias).
  assets:
    - assets/fonts/licenses/

  # Fuentes empaquetadas: cero red. Solo los pesos que usan los tokens.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader16pt-Medium.ttf
          weight: 500
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
